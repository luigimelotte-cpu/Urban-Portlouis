# Local PostgreSQL with pgvector. `docker compose up -d` then `npm run db:migrate`.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lumen
    ports:
      - "5432:5432"
    volumes:
      - lumen-db:/var/lib/postgresql/data
volumes:
  lumen-db:
